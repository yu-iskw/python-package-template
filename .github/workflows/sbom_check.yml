name: SBOM check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          install: false
          cache: true

      - name: Install Trivy and Grype via mise
        run: mise install --locked trivy grype

      - name: Generate and scan CycloneDX SBOM
        run: mise run sbom-check

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: dist/sbom/sbom.cdx.json
          if-no-files-found: warn
