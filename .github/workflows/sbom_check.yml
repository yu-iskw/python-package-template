name: SBOM check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sbom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          install: false
          cache: true

      - name: Install Trivy and Grype via mise
        run: mise install --locked trivy grype

      - name: Generate and scan CycloneDX SBOM
        env:
          # Keep this job SBOM-only: do not auto-install trunk/osv/codeql from [tools].
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run sbom-check

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: dist/sbom/sbom.cdx.json
          if-no-files-found: warn
