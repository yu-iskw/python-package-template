name: SBOM toolchain check

# This workflow validates the mise/Trivy/Grype SBOM toolchain itself. The
# dependency audit workflow is the automatic security gate; avoid generating
# and scanning a second SBOM on every pull request and main push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install: false
          cache: true

      - name: Install Trivy and Grype via mise
        run: mise install --locked trivy grype

      - name: Generate and scan CycloneDX SBOM
        env:
          # Keep this job SBOM-only: do not auto-install trunk/osv/codeql from [tools].
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run sbom-check

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: dist/sbom/sbom.cdx.json
          if-no-files-found: warn
