name: Test python

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - noxfile.py
      - pyproject.toml
      - src/your_package/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - noxfile.py
      - pyproject.toml
      - src/your_package/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test supported Python versions
    runs-on: ubuntu-latest
    permissions:
      contents: read # For repo checkout
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: YOUR_PYTHON_PACKAGE_NAME
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install supported Python versions
        run: uv python install 3.10 3.11 3.12

      - name: Run tests across Python versions in parallel
        run: |
          set -euo pipefail
          nox_spec='nox[uv]==2026.7.11'
          uvx --from "${nox_spec}" nox --list >/dev/null
          printf '%s\0' 3.10 3.11 3.12 \
            | xargs -0 -P "$(nproc)" -I{} \
                uvx --from "${nox_spec}" nox --session "tests-{}"

      - name: Prepare primary validation environment
        run: uv sync --frozen --all-extras --python 3.12

      - name: Vulture (dead code)
        run: uv run vulture

      - name: Test build
        run: uv run bash dev/build.sh
