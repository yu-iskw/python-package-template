name: Test python

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - noxfile.py
      - pyproject.toml
      - src/your_package/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - noxfile.py
      - pyproject.toml
      - src/your_package/**/*.py
      - pylintrc
      - mise.toml
      - mise.lock
      - Makefile
      - dev/**
      - uv.lock
      - .python-version
      - requirements.setup.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test supported environments
    runs-on: ubuntu-latest
    permissions:
      contents: read # For repo checkout
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: YOUR_PYTHON_PACKAGE_NAME
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Run compatibility tests
        run: uv run --with "nox[uv]==2026.7.11" bash dev/test_all.sh

      - name: Prepare primary validation environment
        run: uv sync --frozen --all-extras --python 3.12

      - name: Vulture (dead code)
        run: uv run vulture

      - name: Test build
        run: uv run bash dev/build.sh
