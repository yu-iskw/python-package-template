name: Mise toolchain

on:
  pull_request:
    paths:
      - .github/workflows/mise_toolchain.yml
      - mise.toml
      - mise.lock
      - .trunk/trunk.yaml
      - Makefile
      - dev/setup-tools.sh
      - dev/codeql-platform.sh
      - dev/test-mise-toolchain.sh
      - dev/codeql.sh
      - dev/normalize_cyclonedx_sbom.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/mise_toolchain.yml
      - mise.toml
      - mise.lock
      - .trunk/trunk.yaml
      - Makefile
      - dev/setup-tools.sh
      - dev/codeql-platform.sh
      - dev/test-mise-toolchain.sh
      - dev/normalize_cyclonedx_sbom.py

permissions: {}

jobs:
  mise-toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read # For repo checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install: true
          cache: true

      - name: Smoke test mise integration
        run: bash ./dev/test-mise-toolchain.sh

      - name: Verify Makefile delegates to mise run (no wrapper script)
        run: |
          test ! -e dev/mise-exec.sh
          grep -q 'mise run lint' Makefile
          ! grep -q '^MISE_EXEC' Makefile
